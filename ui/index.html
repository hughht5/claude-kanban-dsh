<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="theme.js"></script>
<link rel="stylesheet" href="board.css">
<link rel="stylesheet" href="vendor/xterm.css">
<link rel="stylesheet" href="panel.css">
<link rel="stylesheet" href="update.css">
<link rel="stylesheet" href="settings.css">
<link rel="stylesheet" href="stacks.css">
<link rel="stylesheet" href="needs.css">
<link rel="stylesheet" href="labels.css">
<link rel="stylesheet" href="times.css"><!-- time in each column (card #111) -->
<link rel="stylesheet" href="review.css">

<link rel="stylesheet" href="agents-feed.css">
<link rel="stylesheet" href="rpane.css">
<!-- card #120: board face -->
<link rel="stylesheet" href="filterbar.css">
<link rel="stylesheet" href="face.css">
<link rel="stylesheet" href="router.css"><!-- the Router panel (card #119) -->
<link rel="stylesheet" href="subagents.css"><!-- per-card subagents (card #151) -->
<link rel="stylesheet" href="archive-ask.css"><!-- the Done pile (card #131) -->
</head>
<body>
<div id="testBar" class="testbar" role="status" hidden><b>TEST VERSION:</b> a copy of your board for trying changes. Work done here stays here; the live app is separate.</div>
<header>
  <h1>Claude Kanban DSH</h1>
  <span class="status" id="status">Loading cards…</span>
  <button class="btn addbtn" id="addBtn" type="button" hidden>Add card</button>
  <button class="ibtn rbtn" id="routerBtn" type="button" aria-pressed="false" hidden>Router</button>
  <button class="ibtn gear" id="settingsBtn" type="button" title="Settings" aria-label="Settings" hidden>⚙ Settings</button>
  <div class="filter"><input type="search" id="q" placeholder="Filter, or a card number…" aria-label="Filter cards"><button class="ibtn" id="searchBtn" type="button" title="Search every card's session history (Ctrl+Shift+F)">Search sessions</button></div>
</header>
<div id="emptyNote" class="empty" hidden>
  <h2>No cards yet</h2>
  Use <b>Add card</b> to add a task.
</div>
<main class="board" id="board" aria-label="Board columns"></main>
<dialog id="addDlg" aria-label="Add card"></dialog>
<dialog id="searchDlg" aria-label="Search sessions"></dialog>
<script src="vendor/marked.min.js"></script>
<script src="vendor/purify.min.js"></script>
<script src="vendor/xterm.js"></script>
<script src="vendor/addon-fit.js"></script>
<script src="termlink.js"></script><!-- one terminal on a session PTY (card #95) -->
<script src="labels.js"></script>
<script src="board.js"></script>
<script src="small.js"></script>
<script src="subagents.js"></script><!-- per-card subagents (card #151) -->
<script src="panel.js"></script>
<script src="evidence.js"></script>
<script src="paste.js"></script>
<script src="needs.js"></script>
<script src="check-size.js"></script>
<script src="stack.js"></script>
<script src="stacks.js"></script>
<script src="review.js"></script>
<script src="steps.js"></script>
<script src="done-when.js"></script>
<script src="waits.js"></script>
<script src="update.js"></script>
<script src="quit.js"></script>
<script src="resume.js"></script>
<script src="live-switch.js"></script>
<script src="settings.js"></script>
<script src="times.js"></script><!-- time in each column (card #111) -->
<script src="testapp.js"></script>
<script src="changes.js"></script>
<script src="search.js"></script>
<!-- card #120: review, search, feed (before the face block, so face.js stays last) -->
<script src="agents-feed.js"></script>
<!-- card #120: board face -->
<script src="filterbar.js"></script>
<script src="face.js"></script>
<script src="archive-ask.js"></script><!-- the Done pile (card #131) -->
<script src="colwidths.js"></script><!-- column widths (card #130): after every script that adds a column, so its render hook runs last -->
<script src="router.js"></script><!-- the Router panel (card #119) -->
</body>
</html>
