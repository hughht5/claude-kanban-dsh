[package]
name = "claude-kanban-dsh"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }
chrono.workspace = true

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
kanban-store = { path = "../crates/store" }
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
portable-pty = "0.8"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
windows = { version = "0.58", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging"] }
tauri-plugin-notification = "2"
tauri-winrt-notification = "0.8"
tauri-plugin-single-instance = "2"
vt100 = "0.16"

[dev-dependencies]
tempfile.workspace = true
